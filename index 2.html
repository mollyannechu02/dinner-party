<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#142e25"><title>Dinner Party</title><style>
*{box-sizing:border-box}body{margin:0;background:#142e25;color:#f5eddf;font:16px system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}h1,h2,h3{font-family:Georgia,serif;font-weight:400;margin:0 0 12px}h1{font-size:36px}h2{font-size:26px}p{line-height:1.55;margin:8px 0 16px}small,.eyebrow{color:#d6b77e;font-size:11px;letter-spacing:2px;text-transform:uppercase}#app{max-width:560px;margin:auto;min-height:100dvh;padding-bottom:95px}header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid #c4a36c44}header em{font:italic 30px Georgia;color:#f5eddf}section{padding:22px}button{border:1px solid #c4a36c88;border-radius:10px;background:transparent;color:inherit;padding:12px 16px;margin:4px 2px}button.primary{background:#d4b77e;color:#142e25;border:0;font-weight:650}button.full{width:100%;margin:8px 0}button.link{border:0;padding:8px;color:#d6b77e}input,textarea,select{display:block;width:100%;padding:13px;border:1px solid #c4a36c77;border-radius:9px;background:#fffaf0;color:#142e25;margin:7px 0 17px}textarea{min-height:95px}label{display:block;font-size:14px}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,560px);display:flex;background:#10271f;border-top:1px solid #c4a36c66;padding:8px 3px calc(8px + env(safe-area-inset-bottom));z-index:5}nav button{flex:1;border:0;padding:5px 0;margin:0;font-size:11px;color:#d0c7b6}nav svg{display:block;margin:0 auto 5px;width:23px;height:23px}nav .active{color:#e4c68b}svg{stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}.hero{min-height:340px;background:linear-gradient(0deg,#142e25 1%,#142e2500 80%),url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=1000&auto=format&fit=crop') center/cover;display:flex;align-items:end;padding:24px}.welcome{text-align:center;background:radial-gradient(ellipse at 15% 10%,#b88a4938,transparent 40%),#142e25}.gold{color:#d6b77e}.card{border:1px solid #c4a36c44;border-radius:16px;overflow:hidden;margin:14px 0;background:#ffffff08}.pad{padding:18px}.cream{background:#f5eddf;color:#233b30}.cream small,.cream .eyebrow,.cream .link{color:#783248}.cream button{border-color:#94794d}.photo{width:100%;height:360px;object-fit:cover;display:block;background:#344b40}.row{display:flex;align-items:center;gap:12px}.row>*{min-width:0}.spread{justify-content:space-between}.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#bca786}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.chip{border:1px solid #c4a36c77;border-radius:30px;padding:6px 10px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .card{margin:0}.grid img{width:100%;height:130px;object-fit:cover}.muted{opacity:.75;font-size:13px}.rule{border-top:1px solid #c4a36c55;margin:18px 0}.maroon{background:#641f35}.navy{background:#19283e}.bubble{padding:13px 16px;border-radius:16px;background:#e5d9c6;margin:12px 0;max-width:85%}.mine{margin-left:auto;background:#142e25;color:#fff}.notice{font-size:12px;padding:10px;border:1px solid #c4a36c55;border-radius:8px}.progress{height:4px;background:#ffffff22;margin:14px 0 25px}.progress i{display:block;height:100%;background:#d4b77e}.check{display:flex;gap:10px;align-items:center;margin:12px 0}.check input{width:auto;margin:0}.thumb{width:100%;height:140px;object-fit:cover;border-radius:10px}.empty{padding:30px 10px;text-align:center}.art{height:150px;background:radial-gradient(circle at 20% 20%,#d9b16c88,transparent 22%),radial-gradient(circle at 80% 40%,#d9b16c55,transparent 20%),linear-gradient(135deg,#37251d,#142e25);display:grid;place-items:center}.art svg{width:90px;height:90px;color:#d6b77e}a{color:inherit}button:focus-visible{outline:3px solid #e8c98e}
</style></head><body><main id="app"></main><script>
const $=id=>document.getElementById(id), app=$('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let S={profile:{},saved:[],likes:[],matches:[],messages:{},wishlist:[],ideas:[],answers:[],friends:[],done:false};try{Object.assign(S,JSON.parse(localStorage.getItem('dinnerV2')||'{}'))}catch{}function save(){try{localStorage.setItem('dinnerV2',JSON.stringify(S))}catch{alert('Device storage is full; changes may not persist.')}}let tab='Meet',view='',step=0,idx=0,filter='All',guestId=0;const icons={Meet:'<path d="M3 3h7l-1 6q-2 4-5 0zM6.5 12v8m-4 0h8M14 3h7l-1 6q-2 4-5 0zM17.5 12v8m-4 0h8"/>','Table Talk':'<path d="M3 4h18v12H9l-6 5zM7 8h10m-10 4h7"/>',Explore:'<circle cx="12" cy="12" r="9"/><path d="m15 9-2 4-4 2 2-4z"/>',Chat:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 6 9 7 9-7"/>',You:'<circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>'};const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[n]||icons.Meet}</svg>`;const img=(id,w=800)=>`https://images.unsplash.com/${id}?w=${w}&auto=format&fit=crop&q=85`;const guests=[{name:'Daniel',age:29,job:'Architect',photo:'photo-1500648767791-00dcc994a43e',tags:['Creative','Family-oriented','Curious'],bio:'I design spaces for a living and cook elaborate dinners for fun. I love discovering a new city on foot.',values:'Kindness, curiosity, family and making time for people.',future:'Build a meaningful career and a warm home filled with friends.',life:'Coffee, running, bookstores and Sunday dinners.',connect:'I appreciate direct communication and thoughtful little gestures.',quote:'He remembers the little things you tell him.',friend:'Michael · friend of 8 years',answer:'A long dinner with friends where nobody checks the time.',interest:'Live jazz and homemade pasta'},{name:'James',age:28,job:'Teacher',photo:'photo-1506794778202-cbf6068b4bc1',tags:['Warm','Bookish','Adventurous'],bio:'I teach history, collect secondhand books and never turn down a road trip.',values:'Patience, humor and showing up.',future:'Keep learning and build a life with someone kind.',life:'Hiking, coffee and cooking for friends.',connect:'Quality time and honest conversations.',quote:'He makes everyone feel included.',friend:'Sam · friend of 5 years',answer:'Finding a great book in a secondhand shop.',interest:'Pottery and hiking'},{name:'Isabel',age:27,job:'Designer',photo:'photo-1534528741775-53994a69daeb',tags:['Artistic','Thoughtful','Playful'],bio:'I love making things, exploring markets and finding beauty in ordinary moments.',values:'Creativity, honesty and generosity.',future:'Travel, grow my studio and stay close to family.',life:'Photography, museums and long walks.',connect:'Shared experiences and open communication.',quote:'She makes ordinary days memorable.',friend:'Ana · friend of 6 years',answer:'Fresh flowers and a walk with a friend.',interest:'Art galleries and markets'}];const activities=[['Live jazz','Music','photo-1511192336575-5a79af67a629','Find a cozy jazz club or an outdoor concert.'],['Coffee & conversation','Food','photo-1501339847302-ac426a4a7cbb','Explore a new café or try a coffee tasting.'],['Try pottery','Creative','photo-1565193298357-c5bdf72c9c38','Make something with your hands.'],['Market mornings','Food','photo-1488459716781-31db52582fe9','Browse local produce, flowers and little treats.'],['An afternoon of art','Culture','photo-1531058020387-3be344556be6','Visit a gallery or museum.'],['A sunset hike','Outdoors','photo-1551632811-561732d1e306','Find a scenic trail and enjoy the evening.']];function photo(g,cls='photo'){return `<img class="${cls}" src="${img(g.photo)}" alt="Illustrative portrait of ${g.name}" onerror="this.style.display='none'">`}function btn(t,action,cls=''){return `<button class="${cls}" onclick="${action}">${t}</button>`}function shell(content,theme=''){app.className=theme;app.innerHTML=`<header><em>dinner party.</em><small>Good company</small></header>${content}<nav>${Object.keys(icons).map(n=>`<button class="${tab===n?'active':''}" onclick="go('${n}')">${icon(n)}${n}</button>`).join('')}</nav>`;window.scrollTo(0,0)}function go(n){tab=n;view='';render()}function welcome(){app.className='welcome';app.innerHTML=`<div class="hero"><div><small>You're invited</small><h1 style="font-size:54px;font-style:italic">dinner party.</h1></div></div><section><div style="width:64px;margin:auto;color:#d6b77e">${icon('Meet')}</div><h1>Meet people,<br>not profiles.</h1><p>Imagine a thoughtful friend introducing you to someone interesting. A little common ground, a great conversation, and the possibility of something more.</p>${btn('Create my profile','step=0;onboard()','primary full')}${btn('Explore the fictional demo','S.done=true;save();render()','full')}<p class="muted">A private, local prototype. No real accounts or messages.</p><div class="rule"></div><h2>More than a photograph</h2><p>Discover stories, values and perspectives from friends.</p><h2>Your dating life. Your business.</h2><p>Choose who can discover you through your circles and preferences.</p></section>`}const steps=[['Let’s get acquainted','Your basic details',[['name','First name'],['age','Age (18+)','number'],['city','City'],['job','Occupation'],['education','Education'],['languages','Languages']]],['What brings you here?','Your dating intentions and preferences',[['goal','Relationship goal','select','Long-term relationship|Casual dating|Figuring it out'],['pace','Preferred pace','select','Naturally|Intentional but slow|Flexible'],['gender','Your gender'],['seeking','Who you want to meet'],['minAge','Minimum age','number'],['maxAge','Maximum age','number'],['distance','Preferred distance'],['dealbreakers','Important dealbreakers','textarea']]],['What do you bring to the table?','Tell us what makes you, you.',[['bio','A little about me','textarea'],['values','What matters to me (values, faith, family)','textarea'],['interests','Things I love','textarea'],['future','Where I’m headed','textarea'],['life','My everyday life','textarea'],['connect','How I connect with people','textarea']]],['Different sides of you','Add your own photographs.',[]],['Your Circles','Private affiliations and visibility',[['school','Current school (or N/A)'],['work','Current workplace (or N/A)'],['previous','Previous schools / workplaces'],['church','Religious community (optional)'],['organizations','Other organizations'],['visibility','Visibility','select','Discoverable|Discreet — only people I like|Paused']]],['A word from a friend','Invite someone who knows you well.',[]],['Your introduction','Preview and publish your local demo profile.',[]]];function fields(arr){return arr.map(([k,l,t,o])=>`<label>${l}${t==='textarea'?`<textarea data-key="${k}">${esc(S.profile[k])}</textarea>`:t==='select'?`<select data-key="${k}">${o.split('|').map(v=>`<option ${S.profile[k]===v?'selected':''}>${v}</option>`).join('')}</select>`:`<input data-key="${k}" type="${t||'text'}" value="${esc(S.profile[k])}">`}</label>`).join('')}function collect(){document.querySelectorAll('[data-key]').forEach(e=>S.profile[e.dataset.key]=e.type==='checkbox'?e.checked:e.value);save()}function checks(){return ['school','work','church','organizations'].map(k=>`<label class="check"><input type="checkbox" data-key="exclude_${k}" ${S.profile['exclude_'+k]?'checked':''}>Exclude people from my ${k}</label>`).join('')}function pics(){return `<div class="grid">${(S.profile.photos||[]).map((p,i)=>`<div><img class="thumb" src="${p}" alt="Your photo">${btn('Remove',`collect();S.profile.photos.splice(${i},1);save();refreshEditor()`)}</div>`).join('')}</div><label>Add photos<input type="file" accept="image/*" multiple onchange="addPhotos(this)"></label><p class="muted">Choose recent, natural photos. Stored only on this device.</p>`}async function addPhotos(el){collect();for(const f of Array.from(el.files).slice(0,5)){if((S.profile.photos||[]).length>=5)break;try{const bitmap=await createImageBitmap(f);const c=document.createElement('canvas');const scale=Math.min(1,720/Math.max(bitmap.width,bitmap.height));c.width=bitmap.width*scale;c.height=bitmap.height*scale;c.getContext('2d').drawImage(bitmap,0,0,c.width,c.height);(S.profile.photos??=[]).push(c.toDataURL('image/jpeg',.75));bitmap.close()}catch{alert('Could not open this photo. Try a JPEG.')}}save();refreshEditor()}function refreshEditor(){view==='edit'?edit():onboard()}function onboard(){app.className='';let [h,d,f]=steps[step];app.innerHTML=`<section><small>YOUR INVITATION · ${step+1} / ${steps.length}</small><div class="progress"><i style="width:${(step+1)/steps.length*100}%"></i></div><h1>${h}</h1><p>${d}</p>${fields(f)}${step===2?btn('Ask The Host for inspiration','host()','full'):''}${step===3?pics():''}${step===4?checks()+'<p class="notice">Demo settings only; exclusions are not enforced against real users.</p>':''}${step===5?friendUI():''}${step===6?ownProfile():''}<div class="row spread">${btn('Back','collect();if(step>0){step--;onboard()}else welcome()')}${btn(step===6?'Finish profile':'Continue','next()','primary')}</div>${btn('Save & exit','collect();S.done=true;save();render()','link')}</section>`;window.scrollTo(0,0)}function next(){collect();if(step===0&&(!S.profile.name||Number(S.profile.age)<18||!Number(S.profile.age))){alert('Enter a first name and age of at least 18.');return}if(step<6){step++;onboard()}else{S.done=true;save();go('Meet')}}function host(){collect();alert('The Host · guided prompt (not live AI)\n\nThink of a recent day that felt especially meaningful. What were you doing, who was there, and why did it matter? Add those details in your own words.')}function ownProfile(){let p=S.profile;return `<div class="card cream">${p.photos?.[0]?`<img class="photo" src="${p.photos[0]}" alt="Your portrait">`:''}<div class="pad"><h2>${esc(p.name||'Your name')}${p.age?', '+esc(p.age):''}</h2><p>${esc(p.job||'Add your occupation')} · ${esc(p.city||'Your city')}</p>${[['bio','A little about me'],['values','What matters to me'],['interests','Little things I love'],['future','Where I’m headed'],['life','Everyday life'],['connect','How I connect']].map(([k,l])=>p[k]?`<small>${l}</small><p>${esc(p[k])}</p>`:'').join('')}</div></div>`}function friendUI(){return `<p>Send a friend a link to a sample questionnaire. In this prototype, their response stays on their device.</p>${btn('Copy questionnaire link','copyFriend()','primary full')}<p class="muted">Real personalized invitations and returned submissions need a server.</p>${btn('Preview friend questionnaire','friendForm()','full')}${S.friends.map(f=>`<div class="card pad">${esc(f.name)} · ${esc(f.relationship)}<p>${esc(f.story)}</p></div>`).join('')}`}async function copyFriend(){let u=location.href.split('#')[0]+'#friend';try{await navigator.clipboard.writeText(u);alert('Demo questionnaire link copied.')}catch{prompt('Copy this link',u)}}function friendForm(){app.className='maroon';app.innerHTML=`<section><small>A WORD FROM A FRIEND</small><h1>Through your eyes.</h1><p>Tell us a little about the person who invited you.</p><label>Your first name<input id="fn"></label><label>How do you know them?<input id="fr"></label><label>How long have you known them?<input id="fl"></label><label>What do you appreciate about them?<textarea id="fs"></textarea></label><label>What might surprise someone about them?<textarea id="ft"></textarea></label>${btn('Save sample response','submitFriend()','primary full')}<p class="notice">Local demonstration only. Nothing is transmitted to the inviter.</p>${btn('Return to Dinner Party','location.hash="";render()')}</section>`}function submitFriend(){S.friends.push({name:$('fn').value,relationship:$('fr').value,story:$('fs').value,other:$('ft').value,length:$('fl').value});save();alert('Sample response saved on this device only.');location.hash='';render()}
function guestCard(g,i,full=false){return `<div class="card">${photo(g)}<div class="pad"><h1>${g.name}, ${g.age}</h1><p>${g.job} · Fictional guest<br><span class="muted">Looking for a long-term relationship</span></p><div class="chips">${g.tags.map(t=>`<span class="chip">${t}</span>`).join('')}</div><div class="rule"></div><small>✧ A note from your Host · sample</small><p>${g.name} enjoys ${g.interest.toLowerCase()}. Explore whether you have something in common.</p></div><div class="cream pad"><small>In their own words</small><h2>A little about me</h2><p>${g.bio}</p>${full?[['values','What matters to me'],['future','Where I’m headed'],['life','Everyday life'],['connect','How I connect'],['interest','On my wishlist']].map(([k,l])=>`<div class="rule"></div><h3>${l}</h3><p>${g[k]}</p>`).join(''):btn('Read full profile',`openGuest(${i})`,'full')}<div class="rule"></div><small>A word from a friend · fictional</small><p><i>“${g.quote}”</i></p><p class="muted">${g.friend}</p><div class="row spread">${btn('Next','nextGuest()')}${btn(S.saved.includes(i)?'Saved ✓':'♡ Still curious',`toggleSave(${i})`)}${btn('Say hello',`hello(${i})`,'primary')}</div></div></div>`}function openGuest(i){guestId=i;view='guest';shell(`<section>${btn('‹ Back','view="";render()','link')}${guestCard(guests[i],i,true)}</section>`)}function nextGuest(){idx=(idx+1)%guests.length;go('Meet')}function toggleSave(i){S.saved=S.saved.includes(i)?S.saved.filter(x=>x!==i):[...S.saved,i];save();view==='guest'?openGuest(i):render()}function hello(i){if(!S.likes.includes(i))S.likes.push(i);if(!S.matches.includes(i))S.matches.push(i);save();alert('Demo mutual introduction with '+guests[i].name+'!');go('Chat')}function meet(){shell(`<section><div class="row spread"><small>Thoughtful introductions</small>${btn('Preferences','view="edit";edit()','link')}</div><div class="row">${btn('For you','view="";meet()')}${btn('Saved ('+S.saved.length+')','view="saved";meet()')}${btn('Connections','go("Chat")')}</div>${view==='saved'?(S.saved.length?S.saved.map(i=>guestCard(guests[i],i)).join(''):'<p class="empty">Save someone you’re curious about.</p>'):guestCard(guests[idx],idx)}</section>`)}function table(){shell(`<div class="art">${icon('Meet')}</div><section><small>Table Talk · This week</small><h1>What makes an ordinary Tuesday a good day?</h1><p>Discover personalities through the little things. Fictional guests in this demo.</p>${btn('Share your answer','$("answerbox").hidden=false','primary full')}<div id="answerbox" hidden><textarea id="answer" placeholder="In your own words..."></textarea>${btn('Post locally','postAnswer()')}</div>${S.answers.map(a=>`<div class="card pad"><small>Your answer</small><p>${esc(a)}</p></div>`).join('')}${guests.map((g,i)=>`<div class="card pad"><div class="row">${photo(g,'avatar')}<b>${g.name}, ${g.age}</b></div><p>${g.answer}</p>${btn('View profile',`openGuest(${i})`,'link')}</div>`).join('')}</section>`,'maroon')}function postAnswer(){if($('answer').value.trim()){S.answers.push($('answer').value.trim());save();table()}}function explore(){let all=[...activities,...S.ideas.map(a=>[a,'My ideas','','An experience you added.'])];shell(`<section><small>The Menu · Experiences</small><h1>Something worth sharing.</h1><p>Find things you’d love to do, with or without a date.</p><input id="search" placeholder="Search experiences" oninput="searchIdeas(this.value)"><div class="chips">${['All','Food','Music','Creative','Culture','Outdoors','Saved'].map(c=>btn(c,`filter='${c}';explore()`,filter===c?'primary':'')).join('')}</div><div class="grid" id="ideas">${all.map(([t,c,p,d],i)=> (filter==='All'||filter===c||filter==='Saved'&&S.wishlist.includes(t))?`<div class="card" data-title="${esc(t.toLowerCase())}">${p?`<img src="${img(p,500)}" alt="${esc(t)}" onerror="this.style.display='none'">`:'<div class="art">✧</div>'}<div class="pad"><small>${c}</small><h3>${esc(t)}</h3><p class="muted">${esc(d)}</p>${btn(S.wishlist.includes(t)?'Saved ✓':'Save idea',`wish(${i})`)}</div></div>`:'').join('')}</div><div class="rule"></div><label>Add your own experience<input id="newidea" placeholder="e.g. Learn salsa dancing"></label>${btn('Add idea','addIdea()','primary full')}</section>`,'navy')}function searchIdeas(q){document.querySelectorAll('[data-title]').forEach(e=>e.hidden=!e.dataset.title.includes(q.toLowerCase()))}function wish(i){let t=[...activities.map(a=>a[0]),...S.ideas][i];S.wishlist=S.wishlist.includes(t)?S.wishlist.filter(x=>x!==t):[...S.wishlist,t];save();explore()}function addIdea(){let t=$('newidea').value.trim();if(t&&!S.ideas.includes(t)){S.ideas.push(t);save();filter='All';explore()}}function chat(){shell(`<section><h1>Conversations</h1><p class="muted">Your mutual introductions · local demo</p>${S.matches.length?S.matches.map(i=>`<div class="card pad row">${photo(guests[i],'avatar')}<div style="flex:1"><b>${guests[i].name}</b><p class="muted">${esc((S.messages[i]||[]).at(-1)||'Say something lovely.')}</p></div>${btn('Open',`thread(${i})`)}</div>`).join(''):'<div class="empty"><h2>Good company awaits.</h2><p>Say hello to a fictional guest to try a conversation.</p>'+btn('Meet guests','go("Meet")','primary')+'</div>'}</section>`)}function thread(i){shell(`<section class="cream" style="min-height:75vh">${btn('‹ Conversations','chat()','link')}<div class="row">${photo(guests[i],'avatar')}<h2>${guests[i].name}</h2></div><p class="notice">Simulated conversation. No messages are sent.</p><div class="bubble">Lovely to meet you! What have you been enjoying lately?</div>${(S.messages[i]||[]).map(m=>`<div class="bubble mine">${esc(m)}</div>`).join('')}<div class="row"><input id="msg" placeholder="Write a message..." style="margin:0">${btn('Send',`send(${i})`,'primary')}</div>${btn('Shall we? · Invite to an experience',`invite(${i})`,'full')}</section>`)}function send(i){let m=$('msg').value.trim();if(m){(S.messages[i]??=[]).push(m);save();thread(i)}}function invite(i){let m=prompt('Write your own invitation. What would you like to do together?');if(m?.trim()){(S.messages[i]??=[]).push('Shall we? '+m);save();thread(i)}}function you(){shell(`<section><small>Your personal introduction</small><h1>${esc(S.profile.name||'Your profile')}</h1>${ownProfile()}<div class="row">${btn('Edit profile','edit()','primary')}${btn('Preview','view="preview";preview()')}</div>${btn('Create / finish guided profile','step=0;onboard()','full')}${btn('A Word from a Friend','view="friends";friendsPage()','full')}${btn('Privacy & dating preferences','edit()','full')}${btn('My wishlist','filter="Saved";go("Explore")','full')}<p class="notice">Prototype: data stays in this browser. Use fictional details. No secure account, live AI, matching service or privacy enforcement.</p>${btn('View welcome again','welcome()','link')}</section>`)}function preview(){shell(`<section>${btn('‹ Your profile','go("You")','link')}<small>Public profile preview · local only</small>${ownProfile()}</section>`)}function friendsPage(){shell(`<section>${btn('‹ Your profile','go("You")','link')}<h1>A word from a friend</h1>${friendUI()}</section>`)}function edit(){view='edit';shell(`<section><h1>Edit your profile</h1>${steps.slice(0,3).map(([h,d,f])=>`<h2>${h}</h2>${fields(f)}`).join('')}<h2>Photos</h2>${pics()}<h2>Your Circles</h2>${fields(steps[4][2])}${checks()}${btn('Save changes','collect();go("You")','primary full')}${btn('Host inspiration','host()','full')}</section>`)}function render(){if(location.hash==='#friend'){friendForm();return}if(!S.done){welcome();return}({Meet:meet,'Table Talk':table,Explore:explore,Chat:chat,You:you}[tab])()}window.addEventListener('hashchange',render);render();
</script></body></html>
