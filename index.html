<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#283d32"><title>Dinner Party — The First Edition</title><style>*{box-sizing:border-box} :root{--paper:#f8f4eb;--ink:#283d32;--wine:#79313b;--line:#d8c9b6}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:18px max(20px,calc((100vw - 850px)/2));border-bottom:1px solid var(--line)}.wordmark{font:italic 30px Georgia;background:none;color:var(--ink);padding:0;border:0;white-space:nowrap}.edition,.eyebrow{font-size:10px;letter-spacing:2.5px;font-weight:700;text-transform:uppercase}.edition{margin-left:12px;text-align:right}main{max-width:850px;margin:auto;padding:28px 22px 100px}h1,h2,h3{font-family:Georgia,serif;font-weight:400;line-height:1.08;margin:12px 0}h1{font-size:clamp(40px,8vw,72px);letter-spacing:-2px}h2{font-size:34px}h3{font-size:24px}p{margin:10px 0 18px}.hero{border:1px solid var(--wine);outline:1px solid var(--wine);outline-offset:-7px;text-align:center;padding:44px 22px;margin:12px 0 28px}.hero svg{width:140px;height:100px}.wine{background:var(--wine);color:var(--paper);padding:28px}.section{border-top:1px solid var(--line);padding:24px 0}.portrait{width:100%;height:290px;object-fit:cover;background:#d8c9b6;display:block}.profile{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}button,.button{font:inherit;font-size:14px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:2px;text-decoration:none;display:inline-block}button.secondary{background:transparent;color:var(--ink)}.wine button{background:var(--paper);color:var(--wine);border-color:var(--paper)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #b49a66;outline-offset:3px}nav{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:3;padding:6px 0 max(6px,env(safe-area-inset-bottom))}nav button{background:none;color:var(--ink);border:0;min-width:0;flex:1;max-width:150px;padding:12px 4px;font-size:12px}nav button.active{color:var(--wine);font-weight:700;border-top:2px solid var(--wine)}footer{text-align:center;font-size:11px;padding:0 12px 90px;color:#665f53}label{display:block;margin:14px 0 5px}input:not([type=checkbox]),textarea,select{width:100%;padding:12px;background:#fffdf7;border:1px solid var(--line);font:inherit;color:var(--ink)}textarea{min-height:90px}blockquote{margin:14px 0;padding-left:16px;border-left:2px solid var(--wine);font:italic 21px Georgia;line-height:1.4}.muted,small{color:#70675c;font-size:13px}.wine small{color:#f8f4eb}.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.tile{border:1px solid var(--line);padding:18px}.bubble{padding:12px 16px;background:#e9dfd0;margin:8px 0;max-width:85%}.mine{margin-left:auto;background:var(--ink);color:white}.notice{font-size:12px;border:1px solid var(--line);padding:10px;margin:12px 0}.link{background:none;color:var(--wine);border:0;text-decoration:underline;padding:5px 0}.rule{border-top:1px solid var(--line);margin:20px 0}@media(max-width:600px){.profile{grid-template-columns:1fr;gap:12px}.portrait{height:310px}.tiles{grid-template-columns:1fr}.hero{padding:35px 18px}main{padding-top:20px}}</style></head><body><header><button class="wordmark" onclick="go('home')">dinner party.</button><span class="edition">THE FIRST EDITION</span></header><main id="app"></main><nav id="nav" aria-label="Main navigation"></nav><footer>Meet people, not profiles. · Fictional interactive demo</footer><script>const $=id=>document.getElementById(id);
const guests=[
{id:1,name:"Daniel",age:29,job:"Architect",photo:"https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=700&auto=format&fit=crop",intro:"You both enjoy creative projects and learning new things. Daniel is attempting homemade pasta — a conversation waiting to happen.",own:"My ideal Saturday starts with a new coffee shop and ends with an unnecessarily ambitious dinner.",friend:"He remembers the little things you tell him.",years:"Friend of eight years",hobbies:"Architecture, cooking, photography",future:"A warm home, meaningful work and plenty of travel.",answer:"A long dinner with friends where nobody checks the time."},
{id:2,name:"James",age:28,job:"Teacher",photo:"https://images.unsplash.com/photo-1506794778202-cbf6063a1bc1?w=700&auto=format&fit=crop",intro:"You share a curiosity about the world and a love of small everyday adventures.",own:"I collect books faster than I read them.",friend:"He makes everyone feel included.",years:"Friend of five years",hobbies:"Books, hiking, live music",future:"Keep learning and build a life with good company.",answer:"Finding a great book in a secondhand shop."},
{id:3,name:"Alex",age:30,job:"Designer",photo:"https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=700&auto=format&fit=crop",intro:"You both appreciate thoughtful design and discovering new places.",own:"I always take the scenic route.",friend:"She turns ordinary afternoons into adventures.",years:"Friend of six years",hobbies:"Art, travel, coffee",future:"A creative life with room for family and friends.",answer:"Coffee outside before the rest of the world wakes up."}];
const activities=["Coffee & Conversation","An evening of jazz","Pottery for two","A photography walk","Farmers market morning","An afternoon at the museum"];
const defaults={name:"Guest",saved:[],liked:[],passed:[],matches:[],chats:{},answers:[],activities:[],visibility:"Discreet introductions",circles:"",hideLocation:true,hideActivity:true,receipts:false,previews:false,personality:false,ai:true,friend:null,invites:[],preferences:{},away:false};
let s;try{s={...defaults,...JSON.parse(localStorage.getItem("dp-v1")||"{}")}}catch{s={...defaults}}
let page="welcome", current=1;
function save(){try{localStorage.setItem("dp-v1",JSON.stringify(s))}catch{}}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function b(label,action,secondary=false){return `<button ${secondary?'class="secondary"':''} onclick="${action}">${label}</button>`}
function head(k,t,d=""){return `<div class="eyebrow">${k}</div><h1>${t}</h1>${d?`<p>${d}</p>`:""}`}
function note(t){return `<div class="notice">${t}</div>`}
function go(p,id){page=p;if(id)current=id;render();window.scrollTo(0,0)}
function guest(id){return guests.find(g=>g.id===id)}
function toggle(key,id){s[key]=s[key].includes(id)?s[key].filter(x=>x!==id):[...s[key],id];save();render()}
function hello(id){if(!s.liked.includes(id))s.liked.push(id);if(!s.matches.includes(id))s.matches.push(id);save();go("match",id)}
function pass(id){if(!s.passed.includes(id))s.passed.push(id);save();go("home")}
function photo(g){return `<img class="portrait" src="${g.photo}" alt="Illustrative stock portrait for fictional guest ${g.name}" onerror="this.style.display='none'">`}
function intro(g,full=false){return `<article class="section"><div class="profile"><div>${s.personality&&!full?b("Reveal photo",`go('profile',${g.id})`,true):photo(g)}</div><div><div class="eyebrow">An introduction</div><h2>${g.name}, ${g.age}</h2><small>${g.job} · Fictional guest</small><p class="eyebrow">${s.ai?"A note from your host · scripted demo":"A little common ground"}</p><p>${s.ai?g.intro:g.hobbies}</p><blockquote>${g.own}</blockquote><div class="eyebrow">A word from a friend</div><p>“${g.friend}”<br><small>${g.years} · Sample, unverified</small></p>${full?"":b("Get to know "+g.name,`go('profile',${g.id})`,true)}</div></div><div class="actions">${b("Keep exploring",`pass(${g.id})`,true)}${b(s.saved.includes(g.id)?"Saved · Still curious":"Still curious",`toggle('saved',${g.id})`,true)}${b("Say hello",`hello(${g.id})`)}</div></article>`}
function render(){let h="",g=guest(current);switch(page){
case "welcome":h=`<div class="hero"><div class="eyebrow">You're cordially invited</div><svg viewBox="0 0 150 100" fill="none" stroke="#79313b" stroke-width="1.3"><ellipse cx="75" cy="50" rx="37" ry="37"/><ellipse cx="75" cy="50" rx="29" ry="29"/><path d="M20 12v30m6-30v30m6-30v30m-12 0q6 12 12 0m-6 8v38M125 12q-12 20-7 40h7v36m0-76v40M60 48q15-18 30 0q-15 18-30 0z"/></svg><h1><i>dinner party.</i></h1><p class="eyebrow">Good company awaits</p><h2>The dating app for people who hate dating apps.</h2><p>Come as you are. We'll make the introduction.</p>${b("RSVP — Come on in","go('onboard')")}<p>${b("Explore the demo","go('home')",true)}</p></div><p>Meet people, not profiles. Your dating life. Your business.</p>${note("Prototype only. All guests, matches and messages are fictional. Do not enter sensitive information.")}${b("The Guest List","go('waitlist')",true)}`;break;
case "home":h=head("The first edition",`Welcome, ${esc(s.name)}.`,"There's someone we'd like you to meet.")+`<small>${esc(s.visibility)} · Demo setting</small>`;let available=guests.filter(x=>!s.passed.includes(x.id)&&!s.liked.includes(x.id));h+=available.length?intro(available[0]):`<p>Good company takes time.</p>${b("Revisit introductions","s.passed=[];s.liked=[];save();render()",true)}`;h+=`<section class="wine"><div class="eyebrow">Table Talk — No. 014</div><h2>What makes an ordinary Tuesday a good day?</h2>${b("Pull up a chair","go('talk')")}</section><section class="section"><h2>On the Menu</h2><p>Something worth sharing: an evening of jazz.</p>${b("Explore the Menu","go('menu')",true)} ${b("Still Curious ("+s.saved.length+")","go('saved')",true)}</section>`;break;
case "profile":h=head("Meet the guests",`Get to know ${g.name}.`)+intro(g,true)+`<section class="section"><h2>Little things I love</h2><p>${g.hobbies}</p><h2>Where I'm headed</h2><p>${g.future}</p><h2>How I connect</h2><p>Good conversation, small gestures and time together.</p><h2>What I'm open to</h2><p>A committed relationship, at a natural pace.</p><h2>Things we could do</h2><p>Coffee, a museum or a long walk.</p></section>`;break;
case "saved":h=head("Private collection","Still Curious.","A little curiosity never hurt.")+ (s.saved.length?s.saved.map(id=>intro(guest(id))).join(""):"<p>No saved introductions yet.</p>");break;
case "talk":h=head("Table Talk — No. 014","Pull up a chair.","What makes an ordinary Tuesday a good day?")+`<form onsubmit="event.preventDefault();s.answers.push($('answer').value);save();render()"><label for="answer">In your own words</label><textarea id="answer" required maxlength="250"></textarea><div class="actions"><button>Share demo answer</button></div></form>`+s.answers.map(a=>`<blockquote>${esc(a)}<br><small>Your answer · Local only</small></blockquote>`).join("")+guests.map(x=>`<section class="section"><div class="eyebrow">${x.name}, ${x.age}</div><blockquote>${x.answer}</blockquote>${b("Get acquainted",`go('profile',${x.id})`,true)}</section>`).join("");break;
case "match":h=`<div class="hero">${head("An introduction","Well, hello.","You both wanted to get to know each other.")}<p>A little common ground. A lot left to discover.</p>${note("Mutual interest is simulated automatically for this demo.")}${b("Start a conversation",`go('chat',${g.id})`)} ${b("Keep exploring","go('home')",true)}</div>`;break;
case "chats":h=head("Correspondence","Good conversation.")+(s.matches.length?s.matches.map(id=>`<section class="section"><h3>${guest(id).name}</h3>${b("Open conversation",`go('chat',${id})`,true)}</section>`).join(""):"<p>Say hello to a guest to start a demo conversation.</p>");break;
case "chat":h=head("Between you two",g.name)+note("Local simulated chat. No messages are sent to anyone.")+`<div class="bubble">Lovely to meet you! What have you been enjoying lately? <small>Scripted example</small></div>`+(s.chats[g.id]||[]).map(m=>`<div class="bubble mine">${esc(m)}</div>`).join("")+`<form onsubmit="event.preventDefault();(s.chats[current]??=[]).push($('msg').value);save();render()"><label for="msg">Your message</label><input id="msg" required maxlength="500"><div class="actions"><button>Send demo message</button></div></form>${b("Shall we?",`go('invite',${g.id})`)} ${b("A little common ground",`go('profile',${g.id})`,true)}<section class="section"><h3>Still interested in getting to know ${g.name}?</h3><p>Life gets busy. Reconnect whenever you're ready.</p>${b("Stepping away","go('privacy')",true)} ${b("End demo conversation","s.matches=s.matches.filter(x=>x!==current);save();go('chats')",true)}</section>`;break;
case "menu":h=head("Explore","The Menu.","Come for the conversation. Stay for the chemistry.")+`<div class="tiles">${activities.map((a,i)=>`<div class="tile"><div class="eyebrow">No. 0${i+1}</div><h3>${a}</h3>${b(s.activities.includes(i)?"Saved":"Save activity",`toggle('activities',${i})`,true)}</div>`).join("")}</div>`;break;
case "invite":h=`<div class="hero">${head("An invitation","Shall we?",`Invite ${g.name} to something lovely.`)}<form onsubmit="event.preventDefault();s.invites.push({id:current,activity:$('activity').value,time:$('when').value,message:$('personal').value});save();go('invited')"><label>Activity</label><select id="activity">${activities.map(a=>`<option>${a}</option>`).join("")}</select><label>When?</label><input id="when" required placeholder="Saturday afternoon"><label>Your personal message</label><textarea id="personal" required></textarea><div class="actions"><button>Send demo invitation</button></div></form></div>`;break;
case "invited":h=head("An invitation","Lovely.","Your invitation was saved locally. Nothing was sent.")+b("Back to conversations","go('chats')");break;
case "you":h=head("Your place at the table",esc(s.name))+["privacy|Between Us","onboard|Let's get acquainted","saved|Still Curious","friend|A Word from a Friend","quiz|What do you bring to the table?","waitlist|The Guest List","photos|Photo guidance"].map(x=>{let [p,t]=x.split("|");return `<section class="section">${b(t,`go('${p}')`,true)}</section>`}).join("")+b("Reset all local demo data","if(confirm('Reset this demo?')){localStorage.removeItem('dp-v1');location.reload()}",true);break;
case "privacy":h=head("Your dating life. Your business.","Between Us.")+note("These controls are saved locally for demonstration. They do not enforce real privacy or filter fictional guests.")+`<label>Visibility</label><select onchange="s.visibility=this.value;save()">${["Open introductions","Discreet introductions","Incognito","Just exploring","Stepping away"].map(v=>`<option ${s.visibility===v?"selected":""}>${v}</option>`).join("")}</select><h2>Your Circles</h2><p>Exclude school, workplace, church or other communities. Use fictional examples only.</p><textarea onchange="s.circles=this.value;save()">${esc(s.circles)}</textarea>`+[["hideLocation","Hide exact location"],["hideActivity","Hide online activity"],["receipts","Enable read receipts"],["previews","Enable notification previews"],["personality","Personality-first discovery"],["ai","Show Host introductions"]].map(([k,t])=>`<label><input type="checkbox" ${s[k]?"checked":""} onchange="s.${k}=this.checked;save()"> ${t}</label>`).join("")+b("Return to your seat","go('you')");break;
case "onboard":h=head("RSVP","Let's get acquainted.","Use invented information for this demonstration.")+`<form onsubmit="event.preventDefault();s.name=$('name').value;s.preferences={age:$('age').value,range:$('range').value,goal:$('goal').value,pace:$('pace').value,interests:$('interests').value};save();go('privacy')"><label>Demo first name</label><input id="name" required value="${esc(s.name)}"><label>Age (18+)</label><input id="age" type="number" min="18" max="120" required value="${esc(s.preferences.age||28)}"><label>Preferred age range</label><input id="range" value="${esc(s.preferences.range||'25–35')}"><label>What are you open to?</label><select id="goal"><option>Committed relationship</option><option>Companionship</option><option>Casual dating</option><option>Still figuring it out</option></select><label>Dating pace</label><select id="pace"><option>Let it happen naturally</option><option>Intentional but slow</option><option>Flexible</option></select><label>Interests and values</label><textarea id="interests">${esc(s.preferences.interests||'')}</textarea><div class="actions"><button>Continue to privacy</button></div></form>`;break;
case "friend":h=head("Through their eyes","A Word from a Friend.","An independent perspective, not a character rating.")+note("Simulated contributor form. No invitation link or verification is performed.")+`<form onsubmit="event.preventDefault();s.friend={relationship:$('rel').value,years:$('years').value,words:$('words').value,status:'Pending'};save();render()"><label>How do you know them?</label><select id="rel"><option>Friend</option><option>Family</option><option>Classmate</option><option>Coworker</option></select><label>How long?</label><input id="years"><label>What is a small thing you appreciate about them?</label><textarea id="words" required></textarea><div class="actions"><button>Submit sample perspective</button></div></form>`+(s.friend?`<section class="section"><blockquote>${esc(s.friend.words)}</blockquote><small>${esc(s.friend.relationship)} · ${esc(s.friend.years)} · Unverified · ${esc(s.friend.status)}</small><div class="actions">${b("Accept entire contribution","s.friend.status='Accepted locally';save();render()")}${b("Decline","s.friend=null;save();render()",true)}</div></section>`:"");break;
case "quiz":h=head("A little self-discovery","What do you bring to the table?","A playful reflection, not a validated personality assessment.")+`<form onsubmit="event.preventDefault();go('result',Number($('style').value))"><label>At a gathering, what feels most natural?</label><select id="style"><option value="1">Asking interesting questions</option><option value="2">Making everyone comfortable</option><option value="3">Sharing stories and ideas</option></select><div class="actions"><button>Discover your reflection</button></div></form>`;break;
case "result":h=`<div class="hero"><div class="eyebrow">What you bring to the table</div><h1>${["","The Curious Guest","The Warm Welcome","The Storyteller"][current]||"The Curious Guest"}</h1><p>Good company comes in many forms.</p><small>Based on one playful answer, not a personality test.</small></div>${b("Try again","go('quiz')",true)}`;break;
case "waitlist":h=head("You're invited.","The Guest List.","Your seat is waiting.")+note("Demonstration only. No real email collection or waitlist.")+`<form onsubmit="event.preventDefault();go('waitdone')"><label>Example city</label><input required placeholder="Chicago"><div class="actions"><button>RSVP to the demo</button></div></form>`;break;
case "waitdone":h=head("The Guest List","You're on the demo list.","No information was transmitted.")+b("Come on in","go('home')");break;
case "photos":h=head("Different sides of you","A little photo guidance.","Natural light, recent photos, clear framing and candid moments. Show what your everyday life actually looks like. No attractiveness ratings or artificial headshots.")+b("Back","go('you')",true);break;
} $("app").innerHTML=h;$("nav").innerHTML=page==="welcome"?"":[["home","Meet"],["talk","Table Talk"],["chats","Chat"],["menu","Explore"],["you","You"]].map(([p,t])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${t}</button>`).join("");}
render();</script></body></html>
