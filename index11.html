const $=id=>document.getElementById(id), app=$('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let S={profile:{},saved:[],likes:[],matches:[],messages:{},wishlist:[],ideas:[],answers:[],friends:[],done:false};try{Object.assign(S,JSON.parse(localStorage.getItem('dinnerV7')||'{}'))}catch{}function save(){try{localStorage.setItem('dinnerV7',JSON.stringify(S))}catch{alert('Device storage is full; changes may not persist.')}}let tab='Meet',view='',step=0,idx=0,filter='All',guestId=0;const icons={Meet:'<path d="M3 3h7l-1 6q-2 4-5 0zM6.5 12v8m-4 0h8M14 3h7l-1 6q-2 4-5 0zM17.5 12v8m-4 0h8"/>','Table Talk':'<path d="M3 4h18v12H9l-6 5zM7 8h10m-10 4h7"/>',Explore:'<circle cx="12" cy="12" r="9"/><path d="m15 9-2 4-4 2 2-4z"/>',Chat:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 6 9 7 9-7"/>',You:'<circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>'};const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[n]||icons.Meet}</svg>`;const img=(id,w=800)=>`https://images.unsplash.com/${id}?w=${w}&auto=format&fit=crop&q=85`;const guests=[{name:'Daniel',age:29,job:'Architect',photo:'photo-1500648767791-00dcc994a43e',tags:['Creative','Family-oriented','Curious'],bio:'I design spaces for a living and cook elaborate dinners for fun. I love discovering a new city on foot.',values:'Kindness, curiosity, family and making time for people.',future:'Build a meaningful career and a warm home filled with friends.',life:'Coffee, running, bookstores and Sunday dinners.',connect:'I appreciate direct communication and thoughtful little gestures.',quote:'He remembers the little things you tell him.',friend:'Michael · friend of 8 years',answer:'A long dinner with friends where nobody checks the time.',interest:'Live jazz and homemade pasta'},{name:'James',age:28,job:'Teacher',photo:'photo-1506794778202-cbf6068b4bc1',tags:['Warm','Bookish','Adventurous'],bio:'I teach history, collect secondhand books and never turn down a road trip.',values:'Patience, humor and showing up.',future:'Keep learning and build a life with someone kind.',life:'Hiking, coffee and cooking for friends.',connect:'Quality time and honest conversations.',quote:'He makes everyone feel included.',friend:'Sam · friend of 5 years',answer:'Finding a great book in a secondhand shop.',interest:'Pottery and hiking'},{name:'Isabel',age:27,job:'Designer',photo:'photo-1534528741775-53994a69daeb',tags:['Artistic','Thoughtful','Playful'],bio:'I love making things, exploring markets and finding beauty in ordinary moments.',values:'Creativity, honesty and generosity.',future:'Travel, grow my studio and stay close to family.',life:'Photography, museums and long walks.',connect:'Shared experiences and open communication.',quote:'She makes ordinary days memorable.',friend:'Ana · friend of 6 years',answer:'Fresh flowers and a walk with a friend.',interest:'Art galleries and markets'}];const activities=[['Live jazz','Music','photo-1511192336575-5a79af67a629','Find a cozy jazz club or an outdoor concert.'],['Coffee & conversation','Food','photo-1501339847302-ac426a4a7cbb','Explore a new café or try a coffee tasting.'],['Try pottery','Creative','photo-1565193298357-c5bdf72c9c38','Make something with your hands.'],['Market mornings','Food','photo-1488459716781-31db52582fe9','Browse local produce, flowers and little treats.'],['An afternoon of art','Culture','photo-1531058020387-3be344556be6','Visit a gallery or museum.'],['A sunset hike','Outdoors','photo-1551632811-561732d1e306','Find a scenic trail and enjoy the evening.']];function photo(g,cls='photo'){return `<img class="${cls}" src="${img(g.photo)}" alt="Illustrative portrait of ${g.name}" onerror="this.style.display='none'">`}function btn(t,action,cls=''){return `<button class="${cls}" onclick="${action}">${t}</button>`}function shell(content,theme=''){app.className=theme;app.innerHTML=`<header><em>dinner party.</em><div class="helpbar">${btn("About","guide()")}${btn("? Help","help()")}</div></header>${content}<nav>${Object.keys(icons).map(n=>`<button class="${tab===n?'active':''}" onclick="go('${n}')">${icon(n)}${n}</button>`).join('')}</nav>`;window.scrollTo(0,0)}function go(n){tab=n;view='';render()}function welcome(){app.className='welcome';app.innerHTML=`<div class="hero"><div><small>You're invited</small><h1 style="font-size:54px;font-style:italic">dinner party.</h1></div></div><section><div style="width:64px;margin:auto;color:#d6b77e">${icon('Meet')}</div><h1>Meet people,<br>not profiles.</h1><p>Imagine a thoughtful friend introducing you to someone interesting. A little common ground, a great conversation, and the possibility of something more.</p>${btn('Create my profile','step=0;onboard()','primary full')}${btn('Explore the fictional demo','S.done=true;save();render()','full')}<p class="muted">A private, local prototype. No real accounts or messages.</p><div class="rule"></div><h2>More than a photograph</h2><p>Discover stories, values and perspectives from friends.</p><h2>Your dating life. Your business.</h2><p>Choose who can discover you through your circles and preferences.</p></section>`}const steps=[['Let’s get acquainted','Your basic details',[['name','First name'],['age','Age (18+)','number'],['city','City'],['job','Occupation'],['education','Education'],['languages','Languages']]],['What brings you here?','Your dating intentions and preferences',[['goal','Relationship goal','select','Long-term relationship|Casual dating|Figuring it out'],['pace','Preferred pace','select','Naturally|Intentional but slow|Flexible'],['gender','Your gender'],['seeking','Who you want to meet'],['minAge','Minimum age','number'],['maxAge','Maximum age','number'],['distance','Preferred distance'],['dealbreakers','Important dealbreakers','textarea']]],['What do you bring to the table?','Tell us what makes you, you.',[['bio','A little about me','textarea'],['values','What matters to me (values, faith, family)','textarea'],['interests','Things I love','textarea'],['future','Where I’m headed','textarea'],['life','My everyday life','textarea'],['connect','How I connect with people','textarea']]],['Different sides of you','Add your own photographs.',[]],['Your Circles','Private affiliations and visibility',[['school','Current school (or N/A)'],['work','Current workplace (or N/A)'],['previous','Previous schools / workplaces'],['church','Religious community (optional)'],['organizations','Other organizations'],['visibility','Visibility','select','Discoverable|Discreet — only people I like|Paused']]],['A word from a friend','Invite someone who knows you well.',[]],['Your introduction','Preview and publish your local demo profile.',[]]];function fields(arr){return arr.map(([k,l,t,o])=>`<label>${l}${t==='textarea'?`<textarea data-key="${k}">${esc(S.profile[k])}</textarea>`:t==='select'?`<select data-key="${k}">${o.split('|').map(v=>`<option ${S.profile[k]===v?'selected':''}>${v}</option>`).join('')}</select>`:`<input data-key="${k}" type="${t||'text'}" value="${esc(S.profile[k])}">`}</label>`).join('')}function collect(){document.querySelectorAll('[data-key]').forEach(e=>S.profile[e.dataset.key]=e.type==='checkbox'?e.checked:e.value);save()}function checks(){return ['school','work','church','organizations'].map(k=>`<label class="check"><input type="checkbox" data-key="exclude_${k}" ${S.profile['exclude_'+k]?'checked':''}>Exclude people from my ${k}</label>`).join('')}function pics(){return `<div class="grid">${(S.profile.photos||[]).map((p,i)=>`<div><img class="thumb" src="${p}" alt="Your photo">${btn('Remove',`collect();S.profile.photos.splice(${i},1);save();refreshEditor()`)}</div>`).join('')}</div><label>Add photos<input type="file" accept="image/*" multiple onchange="addPhotos(this)"></label><p class="muted">Choose recent, natural photos. Stored only on this device.</p>`}async function addPhotos(el){collect();for(const f of Array.from(el.files).slice(0,5)){if((S.profile.photos||[]).
